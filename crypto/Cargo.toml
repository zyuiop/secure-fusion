[package]
name = "crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { workspace = true }
hybrid-array = { workspace = true }
hex = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

hkdf = "0.13.0-rc.0"
sha2 = "=0.11.0-rc.0"
aead = { version = "0.6.0-rc.0", features = ["alloc", "bytes"] }
rand_core = "0.9.3"
rand = "0.9.2"
bytes = { workspace = true }

base64 = "0.22.1"

datafusion = { workspace = true }
common = { path = "../common" }

bincode = { version = "2.0.1", features = ["derive"] }
zerocopy = "0.8.27"

# Ideally temporary, used only for the kw_search implem
chacha20poly1305 = { version = "0.11.0-rc.0", features = ["zeroize"] }
half = { version = "2.6.0", features = ["zerocopy"] }
rustc-hash = { workspace = true }
getrandom = "0.4.0-rc.0"

[features]
decrypt-array-in-place = []

[lints]
workspace = true
